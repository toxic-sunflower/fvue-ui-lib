name: ci
on:
  push:
    branches: [develop, 'hotfix/**', 'release/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
  docs:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run docs:build
  visual:
    runs-on: ubuntu-24.04
    needs: docs
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run docs:build
      - name: dump card title markup (debug)
        working-directory: apps/docs
        run: |
          bun run preview --port 4174 &
          SRV=$!
          sleep 8
          curl -s http://localhost:4174/components/card.html -o /tmp/card.html
          echo "--- h3 tags:"
          grep -o '<h3[^>]*>' /tmp/card.html | head -n 5
          echo "--- fvue-card__title count:"
          grep -o 'fvue-card__title' /tmp/card.html | wc -l
          kill $SRV
      - run: bunx --bun playwright install chromium --with-deps
        working-directory: apps/docs
      - run: bun run test:visual
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diff
          path: apps/docs/test-results/
          retention-days: 7
