name: ci
on:
  push:
    branches: [develop, 'hotfix/**', 'release/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
  docs:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run docs:build
  visual:
    runs-on: ubuntu-24.04
    needs: docs
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run docs:build
      - run: bunx --bun playwright install chromium --with-deps
        working-directory: apps/docs
      # Screenshots are rendered with Inter; without it fallback fonts shift
      # text metrics and baselines (generated with Inter) mismatch.
      - name: install Inter font for stable screenshots
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sL -o ~/.local/share/fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          fc-cache -f
          fc-list | grep -i inter
      - run: bun run test:visual
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diff
          path: apps/docs/test-results/
          retention-days: 7
