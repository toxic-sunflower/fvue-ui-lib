name: upstream-watch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - id: check
        run: |
          if bun run --filter fvue-watch check; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: snapshot, compare and report
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(bun -e 'console.log((await (await fetch("https://registry.npmjs.org/@fanvue%2Fui/latest")).json()).version)')
          PREV=$(ls tools/upstream-watch/snapshots/*.json | grep -v diff- | sort -V | tail -1 | xargs basename | sed 's/\.json//')
          bun run --filter fvue-watch snapshot "$LATEST" --fetch
          bun run --filter fvue-watch compare "$PREV" "$LATEST"
          bun run --filter fvue-watch matrix "$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/upstream-watch/snapshots tools/upstream-watch/matrix.json tools/upstream-watch/matrix.md
          git commit -m "chore(upstream): snapshot @fanvue/ui $LATEST" || true
          git push
          gh label create upstream --description "Upstream library changes" --color "0E8A16" 2>/dev/null || true
          gh issue create \
            --title "[upstream] @fanvue/ui $LATEST" \
            --label upstream \
            --body-file "tools/upstream-watch/snapshots/diff-$PREV-$LATEST.md"
