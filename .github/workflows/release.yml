name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install
      - run: bun run build
      - run: bun run test
      - name: version matches tag
        working-directory: packages/ui
        run: test "v$(bun pm pkg get version | tr -d '"')" = "${{ github.ref_name }}"
      # `npm stage` is only available in recent npm releases
      - run: npm install -g npm@latest
      - run: npm --version
      # The version is staged, not released: approve it on npmjs.com
      # (or `npm stage approve <stage-id>`) to publish it.
      - run: npm stage publish --access public --provenance
        working-directory: packages/ui
      - name: show npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*-debug-*.log | tail -n 60
