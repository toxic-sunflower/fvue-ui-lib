name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run test
      - name: version matches tag
        working-directory: packages/ui
        run: test "v$(bun pm pkg get version)" = "${{ github.ref_name }}"
      - run: bun publish --access public --provenance
        working-directory: packages/ui
